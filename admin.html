<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla • Painel Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020610; --bg-surface: #070e22; --bg-card: #0c1635;
            --border-subtle: rgba(6, 182, 212, 0.18); --border-hover: rgba(59, 130, 246, 0.6);
            --accent-blue: #3b82f6; --accent-cyan: #06b6d4; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-container { width: 100%; max-width: 900px; background: linear-gradient(135deg, #070e22, #0c1635); border-radius: 18px; padding: 25px; border: 1px solid var(--border-hover); margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; gap: 20px; }
        .admin-container.active { display: flex; }
        h2 { color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; font-size: 1.3rem; margin-bottom: 5px; }
        .login-box { display: flex; flex-direction: column; gap: 15px; max-width: 380px; margin: 80px auto; background: var(--bg-surface); padding: 30px; border-radius: 18px; border: 1px solid var(--border-subtle); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .login-box h2 { color: #f87171; font-size: 1.1rem; justify-content: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .form-group input, .form-group textarea { background: rgba(2, 6, 16, 0.7); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; color: var(--text-main); outline: none; width: 100%; }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sorteio { background: linear-gradient(135deg, #f59e0b, #d97706); text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.9rem; }
        .btn-save { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .stats-box { background: rgba(6, 182, 212, 0.05); border: 1px solid var(--border-subtle); padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; color: var(--accent-cyan); }
        .inscritos-table-wrapper { max-height: 220px; overflow-y: auto; border: 1px solid var(--border-subtle); border-radius: 10px; background: rgba(2, 6, 16, 0.5); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th { background: rgba(7, 14, 34, 0.9); padding: 10px 14px; color: var(--text-muted); font-weight: 700; position: sticky; top: 0; }
        td { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.05); }
        .back-link { display: inline-block; margin-top: 10px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--text-main); }
        .divider { height: 1px; background: var(--border-subtle); width: 100%; margin: 5px 0; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DO ADMIN -->
    <div class="login-box" id="loginBox">
        <h2>🔒 Acesso Restrito</h2>
        <div class="form-group">
            <label>Senha do Administrador:</label>
            <input type="password" id="adminPasswordInput" placeholder="Digite a senha...">
        </div>
        <button class="btn" id="verifyAdminPasswordBtn">Entrar no Painel</button>
        <a href="index.html" class="back-link" style="text-align: center;">← Voltar para o Site Principal</a>
    </div>

    <!-- PAINEL DE GERENCIAMENTO -->
    <div class="admin-container" id="adminSection">
        <h2>⚔️ Gerenciamento do Torneio & Sorteio 3x3</h2>

        <div class="stats-box" id="totalInscritosCount">Total de Inscrições Realizadas: Carregando...</div>

        <div class="form-group">
            <label>📋 Lista de Inscritos (Via Site)</label>
            <div class="inscritos-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Líder / Personagem</th>
                            <th>Equipe</th>
                        </tr>
                    </thead>
                    <tbody id="inscritosTableBody">
                        <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Carregando inscritos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="divider"></div>

        <!-- BOTÃO DE SORTEIO AUTOMÁTICO 3X3 -->
        <div class="form-group">
            <label>🎲 Sorteio Automático de Trios</label>
            <button class="btn btn-sorteio" id="sortearTriosBtn">🎲 Sortear Grupos de 3 (3x3) Automaticamente & Publicar</button>
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label>✏️ Editor Manual de Chaves (Caso queira ajustar algo manualmente):</label>
            <textarea id="bracketTextInput" placeholder="Edite as chaves ou cole os confrontos aqui..."></textarea>
        </div>
        <button class="btn btn-save" id="saveBracketBtn">💾 Salvar e Publicar Chaves no Site</button>

        <a href="index.html" class="back-link">← Ver o Site Principal / Chaveamento</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB9899Lz-E1vzjM2HEbqxbau3Yd_-SDRo", authDomain: "valhalla-torneio.firebaseapp.com", projectId: "valhalla-torneio", storageBucket: "valhalla-torneio.firebasestorage.app", messagingSenderId: "553847682466", appId: "1:553847682466:web:9dcfe92cedbf1a91bdeefb" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let inscritosCache = [];

        async function carregarPainelAdmin() {
            const tableBody = document.getElementById('inscritosTableBody');
            const totalBox = document.getElementById('totalInscritosCount');
            const bracketInput = document.getElementById('bracketTextInput');

            try {
                const querySnapshot = await getDocs(collection(db, "inscricoes"));
                inscritosCache = [];
                tableBody.innerHTML = "";
                
                if (querySnapshot.empty) {
                    totalBox.textContent = `Total de Inscrições Realizadas: 0`;
                    tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Nenhuma inscrição encontrada.</td></tr>`;
                } else {
                    let count = 0;
                    querySnapshot.forEach((docSnap) => {
                        count++;
                        const data = docSnap.data();
                        inscritosCache.push(data);
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${data.data || 'N/D'}</td>
                            <td style="color: var(--accent-cyan); font-weight: 700;">${data.lider}</td>
                            <td>${data.equipe}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                    totalBox.textContent = `Total de Inscrições Realizadas: ${count}`;
                }

                const configSnap = await getDoc(doc(db, "config", "chaves"));
                if (configSnap.exists() && configSnap.data().texto) {
                    bracketInput.value = configSnap.data().texto;
                }

            } catch (e) {
                console.error(e);
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #f87171;">Erro ao carregar dados do banco.</td></tr>`;
            }
        }

        // Login (Senha restaurada para valhalla123)
        document.getElementById('verifyAdminPasswordBtn').addEventListener('click', () => {
            const senha = document.getElementById('adminPasswordInput').value;
            if (senha === "valhalla123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminSection').classList.add('active');
                carregarPainelAdmin();
            } else {
                alert('Senha incorreta!');
            }
        });

        // Botão de Sortear Automático 3x3
        document.getElementById('sortearTriosBtn').addEventListener('click', async () => {
            if (inscritosCache.length === 0) {
                alert('Não há inscrições suficientes no banco de dados para realizar o sorteio.');
                return;
            }

            let copia = [...inscritosCache];
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }

            let grupos = [];
            let grupoAtual = [];
            copia.forEach((item, index) => {
                grupoAtual.push(`Líder: ${item.lider} (Equipe: ${item.equipe})`);
                if (grupoAtual.length === 3 || index === copia.length - 1) {
                    grupos.push([...grupoAtual]);
                    grupoAtual = [];
                }
            });

            let textoSorteio = "⚔️ SORTEIO OFICIAL DE TRIOS (3x3) - ARENA VALHALLA ⚔️\n\n";
            grupos.forEach((grupo, idx) => {
                textoSorteio += `🛡️ Grupo / Chave ${idx + 1}:\n`;
                grupo.forEach((membro, mIdx) => {
                    textoSorteio += `   ${mIdx + 1}. ${membro}\n`;
                });
                textoSorteio += `\n`;
            });

            document.getElementById('bracketTextInput').value = textoSorteio;

            try {
                await setDoc(doc(db, "config", "chaves"), {
                    texto: textoSorteio,
                    atualizadoEm: new Date().toLocaleString('pt-BR')
                });
                alert('🎲 Sorteio 3x3 realizado e publicado com sucesso no site principal!');
            } catch (e) {
                alert('Erro ao publicar o sorteio: ' + e.message);
            }
        });

        // Botão de salvar alterações manuais
        document.getElementById('saveBracketBtn').addEventListener('click', async () => {
            const novoTexto = document.getElementById('bracketTextInput').value;
            try {
                await setDoc(doc(db, "config", "chaves"), {
                    texto: novoTexto,
                    atualizadoEm: new Date().toLocaleString('pt-BR')
                });
                alert('💾 Chaves salvas e atualizadas com sucesso no site principal!');
            } catch (e) {
                alert('Erro ao salvar: ' + e.message);
            }
        });
    </script>
</body>
</html>
