<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9899Lz-E1vzjM2HEbqxbau3Yd_-SDRo",
            authDomain: "valhalla-torneio.firebaseapp.com",
            projectId: "valhalla-torneio",
            storageBucket: "valhalla-torneio.firebasestorage.app",
            messagingSenderId: "553847682466",
            appId: "1:553847682466:web:9dcfe92cedbf1a91bdeefb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SENHA_SECRETA = "valhalla123";

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const pass = document.getElementById('adminPassword').value;
            if (pass === SENHA_SECRETA) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                carregarDadosAdmin();
            } else {
                alert('Senha incorreta!');
            }
        });

        async function carregarDadosAdmin() {
            const tbody = document.getElementById('inscricoesList');
            try {
                const querySnapshot = await getDocs(collection(db, "inscricoes"));
                tbody.innerHTML = '';
                let total = 0;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    total++;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${data.data || '-'}</td><td style="color:#60a5fa; font-weight:700;">${data.lider}</td><td>${data.equipe}</td>`;
                    tbody.appendChild(tr);
                });
                document.getElementById('totalCount').textContent = total;
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" style="color:red;">Erro ao carregar inscrições: ${e.message}</td></tr>`;
            }

            try {
                const bracketDoc = await getDoc(doc(db, "config", "chaves"));
                if (bracketDoc.exists()) {
                    document.getElementById('bracketData').value = bracketDoc.data().texto || '';
                }
            } catch (e) {
                console.log("Nenhuma chave salva ainda.");
            }
        }

        document.getElementById('saveBracketBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBracketBtn');
            const textoChaves = document.getElementById('bracketData').value;
            
            if (!textoChaves.trim()) {
                alert('Digite algo nas chaves antes de salvar!');
                return;
            }

            btn.textContent = 'Salvando no Firebase...';
            btn.disabled = true;

            try {
                await setDoc(doc(db, "config", "chaves"), {
                    texto: textoChaves,
                    atualizadoEm: new Date().toLocaleString('pt-BR')
                });
                alert('✅ Chaves publicadas com sucesso! Atualize o site principal para ver.');
            } catch (e) {
                alert('❌ Erro ao salvar chaves: ' + e.message);
            } finally {
                btn.textContent = '💾 Salvar e Publicar Chaves no Site';
                btn.disabled = false;
            }
        });
    </script>
