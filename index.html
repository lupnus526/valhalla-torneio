<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla • Torneio Arena Kakele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020610;
            --bg-surface: #070e22;
            --bg-card: #0c1635;
            --border-subtle: rgba(6, 182, 212, 0.18);
            --border-hover: rgba(59, 130, 246, 0.6);
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-blue: rgba(59, 130, 246, 0.35);
            --glow-cyan: rgba(6, 182, 212, 0.25);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-deep); color: var(--text-main); display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; overflow-x: hidden; padding-bottom: 60px; width: 100%;
        }

        img { max-width: 100%; height: auto; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* SAKURA PETALS */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
        .petal { position: absolute; background: linear-gradient(135deg, #ffb7c5 0%, #ff6b8b 100%); border-radius: 150% 0 150% 0; animation: fall linear infinite, sway ease-in-out infinite; opacity: 0.75; }
        @keyframes fall { 0% { top: -10vh; } 100% { top: 110vh; } }
        @keyframes sway { 0%, 100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(60px) rotate(190deg); } }

        header {
            width: 100%; background-color: rgba(7, 14, 34, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
            flex-wrap: wrap; gap: 10px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; }
        .custom-logo-img { width: 35px; height: 35px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-subtle); box-shadow: 0 0 15px var(--glow-cyan); }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ESTILIZAÇÃO ELEGANTE DO TRADUTOR NO TOPO */
        #google_translate_element select {
            background: #0c1635;
            color: #f8fafc;
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #google_translate_element select:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        .goog-logo-link { display: none !important; }
        .goog-te-gadget { color: transparent !important; font-size: 0px; }

        .tournament-badge-top {
            width: 92%; max-width: 1350px; margin-top: 24px; background: linear-gradient(135deg, rgba(7, 14, 34, 0.9), rgba(12, 22, 53, 0.9));
            backdrop-filter: blur(12px); border: 1px solid var(--border-hover); padding: 12px 20px; border-radius: 16px;
            font-size: 0.85rem; font-weight: 800; letter-spacing: 1px; color: var(--accent-cyan); text-align: center; text-transform: uppercase;
        }

        .hero {
            width: 92%; max-width: 1350px; height: 380px; margin-top: 16px; border-radius: 20px; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 20px;
            border: 1px solid var(--border-subtle); background-color: #070e22;
            background-image: linear-gradient(180deg, rgba(2, 6, 16, 0.1) 40%, rgba(2, 6, 16, 0.95) 100%), url('torneio-novo.jpg');
            background-position: center center; background-size: cover;
        }
        .hero-dock { width: 100%; display: flex; justify-content: center; }
        .dock-container {
            background-color: rgba(7, 14, 34, 0.92); padding: 10px 20px; border-radius: 100px; backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.35); display: flex; gap: 14px;
        }
        .dock-item {
            width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--bg-card), var(--bg-deep));
            border: 1px solid var(--border-subtle); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; font-size: 1.1rem;
        }
        .dock-item:hover { background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo)); transform: translateY(-3px) scale(1.1); }

        .info-grid { width: 92%; max-width: 1350px; margin-top: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        
        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .hero { height: 280px; }
            header { padding: 10px 15px; }
        }

        .info-card.clickable {
            position: relative;
            animation: pulseGlowCard 2s infinite alternate;
        }
        @keyframes pulseGlowCard {
            0% { box-shadow: 0 0 10px rgba(6, 182, 212, 0.2), inset 0 0 5px rgba(6,182,212,0.1); border-color: rgba(6, 182, 212, 0.2); }
            100% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.7), inset 0 0 15px rgba(6,182,212,0.3); border-color: rgba(6, 182, 212, 0.8); }
        }

        .info-card {
            background: linear-gradient(135deg, var(--bg-surface), var(--bg-card)); border-radius: 18px; padding: 18px;
            border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.35s ease;
        }
        .info-card.clickable:hover { border-color: var(--border-hover); transform: translateY(-3px); }
        .info-card-left { display: flex; align-items: center; gap: 14px; }
        .info-icon { width: 48px; height: 48px; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--border-subtle); border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; }
        .info-details h3 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; }
        .info-details .value { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
        
        .info-action-hint { 
            font-size: 0.72rem; font-weight: 700; color: #ffffff; background: linear-gradient(135deg, #06b6d4, #3b82f6); 
            padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
            animation: blinkHint 1s infinite alternate; text-align: center;
        }
        @keyframes blinkHint {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        .bracket-section {
            width: 92%; max-width: 1350px; margin-top: 20px;
            background: linear-gradient(135deg, var(--bg-surface), var(--bg-card));
            border-radius: 18px; padding: 22px; border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .bracket-section h3 { font-size: 1rem; color: var(--accent-cyan); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .bracket-content {
            background: rgba(2, 6, 16, 0.6); border: 1px solid var(--border-subtle); border-radius: 10px;
            padding: 16px; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; color: var(--text-main); word-break: break-word;
        }

        .modal-overlay { position: fixed; inset: 0; background-color: rgba(2, 6, 16, 0.88); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.35s ease; padding: 15px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-container { background: linear-gradient(145deg, #070e22, #0c1635); border: 1px solid var(--border-hover); border-radius: 20px; width: 100%; max-width: 480px; box-shadow: 0 35px 70px rgba(0,0,0,0.85); padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
        .modal-close { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
        
        .whatsapp-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-main); }
        .form-group input, .form-group textarea { background: rgba(2, 6, 16, 0.7); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; color: var(--text-main); outline: none; width: 100%; }
        .btn-whatsapp-send { background: linear-gradient(135deg, #25d366, #128c7e); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakuraContainer"></div>

    <header>
        <div class="logo-area">
            <img src="icone.png" alt="Logo" class="custom-logo-img">
            <span>Valhalla • Arena Kakele</span>
        </div>
        <div class="header-right">
            <!-- TRADUTOR ELEGANTE NO TOPO -->
            <div id="google_translate_element"></div>
        </div>
    </header>

    <div class="tournament-badge-top">⚔️ Torneio Oficial da Guilda Valhalla ⚔️</div>

    <section class="hero">
        <div class="hero-dock">
            <div class="dock-container">
                <div class="dock-item" id="openRegistrationBtn" title="Fazer Inscrição">📝</div>
            </div>
        </div>
    </section>

    <section class="info-grid">
        <div class="info-card clickable" id="openRegistrationBtn2">
            <div class="info-card-left">
                <div class="info-icon">🪙</div>
                <div class="info-details">
                    <h3>Taxa de Inscrição</h3>
                    <div class="value" style="color: #60a5fa;">50 kkc</div>
                </div>
            </div>
            <div class="info-action-hint">⚡ Inscrever (50kkc)</div>
        </div>
        <div class="info-card">
            <div class="info-card-left">
                <div class="info-icon">🏆</div>
                <div class="info-details">
                    <h3>Premiação</h3>
                    <div class="value" style="color: #38bdf8;">700 kkc</div>
                </div>
            </div>
        </div>
    </section>

    <section class="bracket-section">
        <h3>⚔️ Chaveamento Oficial do Torneio</h3>
        <div class="bracket-content" id="publicBracket">
            Carregando chaveamento...
        </div>
    </section>

    <div class="modal-overlay" id="registrationModal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">💬 Inscrição na Guilda • WhatsApp</div>
                <button class="modal-close" id="closeRegistrationBtn">✕</button>
            </div>
            <div class="whatsapp-form">
                <div class="form-group">
                    <label>Nome do Personagem (Líder):</label>
                    <input type="text" id="charName" placeholder="Ex: shadowweaver">
                </div>
                <div class="form-group">
                    <label>Equipe / Integrantes:</label>
                    <textarea id="teamDetails" rows="3" placeholder="Ex: zen"></textarea>
                </div>
                <button class="btn-whatsapp-send" id="sendWhatsappBtn">🟢 Enviar Inscrição & Salvar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE TRADUÇÃO NO TOPO -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'pt',
                includedLanguages: 'es,en,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9899Lz-E1vzjM2HEbqxbau3Yd_-SDRo",
            authDomain: "valhalla-torneio.firebaseapp.com",
            projectId: "valhalla-torneio",
            storageBucket: "valhalla-torneio.firebasestorage.app",
            messagingSenderId: "553847682466",
            appId: "1:553847682466:web:9dcfe92cedbf1a91bdeefb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('sakuraContainer');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div'); p.classList.add('petal');
            const size = Math.random() * 8 + 5;
            p.style.width = `${size}px`; p.style.height = `${size * 1.4}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 6}s, ${Math.random() * 3 + 2}s`;
            container.appendChild(p);
        }

        const bracketBox = document.getElementById('publicBracket');
        onSnapshot(doc(db, "config", "chaves"), (docSnap) => {
            if (docSnap.exists() && docSnap.data().texto) {
                bracketBox.textContent = docSnap.data().texto;
            } else {
                bracketBox.textContent = "As chaves do torneio ainda não foram divulgadas pela administração.";
            }
        }, (error) => {
            bracketBox.textContent = "Erro ao carregar o chaveamento. Verifique sua conexão ou regras do Firestore.";
        });

        const modal = document.getElementById('registrationModal');
        const openBtn = document.getElementById('openRegistrationBtn');
        const openBtn2 = document.getElementById('openRegistrationBtn2');
        const closeBtn = document.getElementById('closeRegistrationBtn');

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        openBtn2.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));

        document.getElementById('sendWhatsappBtn').addEventListener('click', async () => {
            const charName = document.getElementById('charName').value.trim();
            const teamDetails = document.getElementById('teamDetails').value.trim();

            if (!charName) { alert('Informe o nome do personagem!'); return; }

            try {
                await addDoc(collection(db, "inscricoes"), {
                    lider: charName,
                    equipe: teamDetails || 'Não informado',
                    data: new Date().toLocaleString('pt-BR')
                });

                const phone = "5519996800189";
                const msg = `⚔️ *INSCRIÇÃO - ARENA KAKELE VALHALLA* ⚔️%0A%0A👤 *Personagem Líder:* ${encodeURIComponent(charName)}%0A👥 *Equipe:* ${encodeURIComponent(teamDetails)}%0A🪙 *Taxa:* 50 kkc`;
                window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
                modal.classList.remove('active');
            } catch (e) {
                alert('Erro ao salvar inscrição: ' + e.message);
            }
        });
    </script>
</body>
</html>
