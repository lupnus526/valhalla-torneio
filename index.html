<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla • Torneio Arena Kakele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-surface: #0b1329;
            --bg-card: #0f1c3f;
            --border-subtle: rgba(59, 130, 246, 0.15);
            --border-hover: rgba(59, 130, 246, 0.5);
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-blue: rgba(59, 130, 246, 0.3);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* --- NAVBAR --- */
        header {
            width: 100%;
            background-color: rgba(11, 19, 41, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.3px;
        }

        .logo-emblem {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 16px var(--glow-blue);
        }
        .logo-emblem::after {
            content: '✦';
            color: white;
            font-size: 1rem;
        }

        /* --- PAINEL CENTRAL --- */
        .hero {
            width: 92%;
            max-width: 1350px;
            min-height: 450px;
            height: 65vh;
            margin-top: 24px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 100px rgba(11, 26, 61, 0.8);
            background: #030712 url('torneio.jpg') center/cover no-repeat;
        }

        .tournament-badge-top {
            background-color: rgba(11, 19, 41, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-hover);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        .hero-dock {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .dock-container {
            background-color: rgba(11, 19, 41, 0.85);
            padding: 10px 20px;
            border-radius: 100px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .dock-item {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: rgba(15, 28, 63, 0.9);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .dock-item:hover {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-color: transparent;
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 8px 20px var(--glow-blue);
        }

        /* --- SEÇÃO DE INFORMAÇÕES (TAXA E PREMIAÇÃO) --- */
        .info-grid {
            width: 92%;
            max-width: 1350px;
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-card {
            background-color: var(--bg-surface);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        .info-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 15px var(--glow-blue);
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-deep));
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .info-details h3 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-details .value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* --- CARDS DE SUPORTE (CHAVES E REGRAS) --- */
        .grid-section {
            width: 92%;
            max-width: 1350px;
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .ref-card {
            background-color: var(--bg-surface);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: all 0.35s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .ref-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 18px 35px rgba(0,0,0,0.6), 0 0 25px var(--glow-blue);
        }

        .card-visual {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #0f1c3f 0%, #070d22 100%);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card-badge-id {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(3, 7, 18, 0.65);
            backdrop-filter: blur(8px);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- MODAIS (GERAL) --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-hover);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 35px var(--glow-blue);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(15, 28, 63, 0.5) 0%, transparent 100%);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: var(--accent-blue);
            color: white;
            border-color: transparent;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* --- ESTILOS DO MODAL DE REGRAS --- */
        .modal-body p.intro {
            color: var(--text-main);
            font-weight: 500;
            background: rgba(59, 130, 246, 0.08);
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-blue);
        }

        .rule-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rule-block h4 {
            color: var(--accent-cyan);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .rule-block ul {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 2px;
        }

        .rule-block ul li {
            position: relative;
            padding-left: 16px;
        }

        .rule-block ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .modal-footer-note {
            text-align: center;
            font-weight: 600;
            color: var(--accent-blue);
            margin-top: 6px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }

        /* --- ESTILOS DO MODAL DE CHAVEAMENTO --- */
        .bracket-modal-container {
            max-width: 1050px;
        }

        .bracket-top-panel {
            background: linear-gradient(135deg, rgba(15, 28, 63, 0.7), rgba(11, 19, 41, 0.7));
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media(min-width: 768px) {
            .bracket-top-panel {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .bracket-top-panel .info-text h4 {
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .bracket-top-panel .info-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-sortear {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow-blue);
            width: 100%;
        }

        @media(min-width: 768px) {
            .btn-sortear {
                width: auto;
            }
        }

        .btn-sortear:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #2563eb, #4f46e5);
        }

        /* Grid da Copa do Mundo Adaptável */
        .bracket-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: center;
        }

        @media(min-width: 900px) {
            .bracket-layout {
                grid-template-columns: 1fr 1.2fr 1fr;
                gap: 24px;
            }
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bracket-column.center {
            align-items: center;
            justify-content: center;
        }

        .bracket-header-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            font-weight: 700;
            text-align: center;
        }

        /* Cartão de Equipe Organizado */
        .matchup-box {
            background: rgba(15, 28, 63, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .matchup-box:hover {
            border-color: var(--border-hover);
            background: rgba(15, 28, 63, 0.9);
        }

        .matchup-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(59, 130, 246, 0.08);
            padding-bottom: 4px;
        }

        .matchup-team-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .matchup-players-list {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.06);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(6, 182, 212, 0.12);
        }

        /* Card Central da Grande Final */
        .grand-final-card {
            background: linear-gradient(135deg, rgba(15, 28, 63, 0.95), rgba(11, 19, 41, 0.95));
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 260px;
            box-shadow: 0 0 30px var(--glow-blue);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 auto;
        }

        .grand-final-card .trophy-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 10px rgba(234, 179, 8, 0.4));
        }

        .grand-final-card h3 {
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 700;
        }

        .final-winner-display {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .final-winner-display .winner-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .final-winner-display .winner-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* Responsividade para Celulares Pequenos */
        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .hero { height: 50vh; min-height: 380px; padding: 16px; }
            .info-grid, .grid-section { grid-template-columns: 1fr; gap: 14px; }
            .info-card { padding: 16px; }
            .info-details .value { font-size: 1.2rem; }
            .modal-container { max-height: 85vh; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-emblem"></div>
            <span>Valhalla • Arena Kakele</span>
        </div>
    </header>

    <section class="hero">
        <div class="tournament-badge-top">⚔️ TORNEIO OFICIAL DA GUILDA ⚔️</div>
        
        <div class="hero-dock">
            <div class="dock-container">
                <div class="dock-item" id="dockBtnBrackets" title="Chaves do Torneio">🛡️</div>
                <div class="dock-item" id="dockBtnRules" title="Regras">📜</div>
                <div class="dock-item" title="Participantes">👥</div>
                <div class
